services:
  app:
    image: youtube-downloader:local
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: '8080'
      WORK_ROOT: /work/jobs
      COBALT_URL: http://cobalt:9000
      BGUTIL_URL: http://bgutil:4416
      CHROMIUM_PATH: /app/scripts/chromium-guest.sh
      SESSION_BROWSER_URL: http://session-browser:8090
      SESSION_VIEWER_URL: http://session-browser:6080
      SESSION_TOKEN_PATH: /control/token
      SESSION_SNAPSHOTS: /work/auth
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080'
    volumes:
      - work-data:/work
      - session-control:/control:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - backend
      - auth
    depends_on:
      cobalt:
        condition: service_healthy
      bgutil:
        condition: service_healthy
      session-browser:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  session-browser:
    image: youtube-session-browser:local
    build:
      context: .
      target: session-browser
    restart: unless-stopped
    read_only: true
    volumes:
      - youtube-session:/session
      - session-control:/control
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - auth
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1-a636575
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: '9000'
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.1-node
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  auth:
    driver: bridge
  backend:
    driver: bridge

volumes:
  work-data:
  youtube-session:
  session-control:
